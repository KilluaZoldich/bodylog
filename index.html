<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons / icons -->
    <link rel="icon" type="image/svg+xml" href="/bodylog/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/bodylog/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/bodylog/favicon-16.png" />

    <!-- iOS Home Screen icon (Apple uses this when "Add to Home Screen") -->
    <link rel="apple-touch-icon" href="/bodylog/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/bodylog/apple-touch-icon.png" />

    <!-- PWA manifest (Android + Chrome install) -->
    <link rel="manifest" href="/bodylog/manifest.webmanifest" />

    <!-- Viewport + iOS PWA chrome -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BodyLog" />

    <!-- Open Graph (for nice link previews in iMessage / Telegram / etc.) -->
    <meta property="og:title" content="BodyLog" />
    <meta property="og:description" content="Mobile-first lean bulk tracker. Editorial liquid glass." />
    <meta property="og:image" content="/bodylog/icon-512.png" />
    <meta property="og:type" content="website" />

    <title>BodyLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
